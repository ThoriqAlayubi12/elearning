<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Safety Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky indigo top bar; home = illustrated Nusantara sea map as hero, then module list and character cards; module = tab stepper over one stage, Kancil guide pinned bottom-left */
  --ink:#1c2147;
  --indigo:#2a3990;
  --sea:#1f2f6e;
  --kunyit:#f6b21b;
  --daun:#23935f;
  --sirih:#d9434f;
  --paper:#f7f8fc;
  --line:#d9dcee;
  --muted:#565c82;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Segoe UI",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--kunyit);outline-offset:3px;border-radius:6px}
svg text{font-family:var(--display)}
.idh{display:none;color:#6a4a00;font-size:.88em;font-style:italic;margin-top:4px}
.help-on .idh{display:block}
.help-on span.idh{display:inline}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--indigo);color:#fff;border-bottom:4px solid var(--kunyit)}
.topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;text-decoration:none;color:#fff;white-space:nowrap}
.brand svg{width:40px;height:40px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill-btn{border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font-weight:700;font-size:15px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill-btn svg{width:18px;height:18px}
.pill-btn[aria-pressed="true"]{background:var(--kunyit);color:var(--ink);border-color:var(--kunyit)}
.star-total{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:20px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 14px 3px 8px;font-variant-numeric:tabular-nums}
.star-total svg{width:24px;height:24px}
@media (max-width:640px){.brand span{display:none}.pill-btn .lbl{display:none}.topbar-inner{padding:8px 12px}}

/* home */
.hero{background:var(--sea);color:#fff;padding:28px 20px 8px}
.hero-inner{max-width:1180px;margin:0 auto}
.eyebrow{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:#c8cff6}
.hero h1{font-size:clamp(36px,5.4vw,64px);font-weight:800;margin-top:6px}
.hero h1 em{font-style:normal;color:var(--kunyit)}
.hero .lead{max-width:62ch;margin-top:8px;font-size:19px;color:#e7eafb}
.hero .lead.idh{color:#ffe7a6}
.map-wrap{margin:14px -8px 0}
.map-wrap svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin:focus-visible circle.ring{stroke:var(--kunyit);stroke-width:7}
.pin-num{font-weight:800;font-size:30px;fill:var(--ink)}
.pin.soon .pin-num,.pin.locked .pin-num{fill:#3b416b}
.pin-label{font-family:var(--body);font-size:14px;font-weight:700;fill:#fff}
.pin.open circle.ring{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}

.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 56px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:32px;font-weight:800}
.sec-head p{color:var(--muted)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mod-card{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px;border:2px solid var(--line);border-radius:var(--r);background:#fff;text-decoration:none;color:inherit;text-align:left;align-items:start;width:100%}
.mod-card.open{border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.mod-card.open:hover{transform:translateY(-2px)}
.mod-num{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;background:var(--kunyit);color:var(--ink);border:3px solid var(--ink)}
.mod-card.soon .mod-num,.mod-card.locked .mod-num{background:#e4e6f2;color:#7d83a8;border-color:#c5c9df}
.mod-card h3{font-size:22px;font-weight:800}
.mod-meta{font-size:14px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eef0fb;color:var(--indigo)}
.chip.done{background:#dff3e8;color:#145c3a}
.chip.soon{background:#efeff3;color:#5d6074}
.chip svg{width:14px;height:14px}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.member{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:12px 14px 16px;text-align:center}
.member svg{height:190px;width:auto;max-width:100%;display:block;margin:0 auto}
.member h3{font-size:24px;font-weight:800;margin-top:4px}
.member p{font-size:15px;color:var(--muted)}
.foot{border-top:2px solid var(--line);margin-top:40px;padding-top:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}
.link-btn{background:none;border:0;text-decoration:underline;color:var(--indigo);font-weight:700;padding:0}

/* module */
.mod-head{background:var(--indigo);color:#fff;padding:14px 20px 0}
.mod-head-inner{max-width:1180px;margin:0 auto}
.crumb{color:#d4d9fa;text-decoration:none;font-weight:700;font-size:16px}
.crumb:hover{text-decoration:underline}
.title-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-top:8px}
.title-row h1{font-size:clamp(28px,4vw,42px);font-weight:800}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 6px 4px 14px;font-variant-numeric:tabular-nums}
.timer .t{font-family:var(--display);font-weight:800;font-size:22px;min-width:3.2ch}
.timer .t-lbl{font-size:13px;color:#c8cff6}
.timer.late .t{color:#ffb4ba}
.timer button{border:0;background:#fff;color:var(--ink);border-radius:999px;font-size:13px;font-weight:700;padding:4px 12px}
.steps{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.step-tab{flex:none;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:14px 14px 0 0;padding:9px 16px 8px;font-weight:700;text-align:left;font-size:16px;line-height:1.2}
.step-tab .min{display:block;font-size:12px;font-weight:400;opacity:.8}
.step-tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.step-tab .tick{display:none;color:#8fe0b4;margin-left:4px}
.step-tab.done .tick{display:inline}
.step-tab[aria-selected="true"] .tick{color:var(--daun)}
.stage{max-width:1180px;margin:0 auto;padding:26px 20px 150px}
.step-intro{margin-bottom:18px;max-width:70ch}
.step-intro h2{font-size:32px;font-weight:800}
.step-intro p{margin-top:4px;color:var(--muted)}
.sub-h{font-size:24px;font-weight:800;margin:32px 0 6px}

/* buttons */
.btn{text-decoration:none;border:0;border-radius:14px;padding:11px 20px;font-family:var(--display);font-weight:700;font-size:20px;background:var(--kunyit);color:var(--ink);box-shadow:0 4px 0 #a87500;display:inline-flex;align-items:center;gap:8px;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a87500}
.btn.sec{background:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn.sec:active{box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:16px;padding:7px 14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:22px;height:22px}
.next-bar{display:flex;justify-content:flex-end;gap:12px;margin-top:28px;flex-wrap:wrap;align-items:center}
.next-bar .hint{color:var(--muted);font-size:15px}

/* story */
.story{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.story{grid-template-columns:1fr}}
.panel{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:6px 6px 0 var(--ink)}
.panel svg{display:block;width:100%;height:auto}
.panel-count{font-family:var(--display);font-weight:700;color:var(--muted);font-size:16px}
.story-text{font-size:23px;line-height:1.6;margin:8px 0 6px}
.vw{border:0;padding:0 2px;font:inherit;background:linear-gradient(transparent 58%,#ffd977 58%);border-radius:2px}
.vw:hover{background:#ffd977}
.word-spot{display:flex;gap:12px;align-items:center;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:12px;min-height:72px;font-size:16px;color:var(--muted)}
.word-spot svg{width:52px;height:52px;flex:none}
.word-spot b{font-family:var(--display);font-size:24px;color:var(--ink);display:block;line-height:1.1}
.story-nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}

/* questions */
.q{margin:14px 0;padding:18px;border:2px solid var(--line);border-radius:var(--r);background:#fff}
.q h4{font-size:22px;font-weight:700;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.q .qnum{color:var(--muted);font-size:15px;font-family:var(--body);font-weight:700}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:19px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{width:34px;height:34px;border-radius:50%;background:#eef0fb;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--display)}
.opt.right{border-color:var(--daun);background:#e3f5ec}
.opt.right .k{background:var(--daun);color:#fff}
.opt.wrong{border-color:var(--sirih);background:#fdeced;animation:shake .4s}
.opt:disabled{cursor:default}
.opt.wrong:disabled{opacity:.7}
.fb{margin-top:12px;font-weight:700;border-radius:12px;padding:10px 14px;font-size:17px}
.fb.good{background:#e3f5ec;color:#145c3a}
.fb.try{background:#fff2d1;color:#714d00}
.spk{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center;padding:0}
.spk svg{width:22px;height:22px}
.spk:active{background:var(--kunyit)}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--ink);text-align:center;font-weight:700;color:var(--indigo)}
.blank.filled{color:var(--daun);border-color:var(--daun)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* vocab */
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.vcard{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:14px 10px;text-align:center;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.vcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.vcard svg{width:76px;height:76px}
.vcard .w{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.vcard .ex{font-size:15px;color:var(--muted)}
.vcard.seen{border-color:var(--daun);box-shadow:0 4px 0 var(--daun)}
.pattern-box{display:grid;gap:8px;background:#fff;border-left:6px solid var(--kunyit);border-radius:0 14px 14px 0;padding:14px 18px;margin-top:8px}
.pattern-box p{font-size:20px}
.pattern-box b{color:var(--indigo)}
.builder{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:18px;margin-top:10px}
.b-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.b-head .count{color:var(--muted);font-weight:700;font-size:15px}
.slot-row{min-height:64px;border:3px dashed #b6bad6;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.slot-row.ok{border-color:var(--daun);border-style:solid;background:#eef9f3}
.slot-row.bad{animation:shake .4s;border-color:var(--sirih)}
.tile-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:52px}
.tile{border:2px solid var(--ink);background:#fff7de;border-radius:10px;padding:6px 16px;font-weight:700;font-size:21px;box-shadow:0 3px 0 var(--ink)}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.b-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* game */
.game-score{display:flex;gap:14px;align-items:center;margin-bottom:16px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{flex:1;max-width:420px;height:16px;border-radius:999px;background:#e4e6f2;overflow:hidden;border:2px solid var(--ink)}
.bar span{display:block;height:100%;width:0;background:var(--daun);transition:width .4s}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{border:3px solid var(--ink);border-radius:22px;padding:14px;min-height:230px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .15s, box-shadow .15s}
.zone svg.zi{width:78px;height:78px}
.zone h3{font-size:26px;font-weight:800}
.zone .zs{font-size:15px;color:var(--muted)}
.zone.vault{background:#e7eafb}
.zone.share{background:#e2f4ea}
.zone.hot{transform:scale(1.03);box-shadow:0 0 0 6px var(--kunyit)}
.zone.flash{animation:flash .6s}
@keyframes flash{40%{box-shadow:0 0 0 10px rgba(35,147,95,.45)}}
.stack{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chipcard{display:inline-flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px;font-size:14px;font-weight:700;animation:pop .35s}
.chipcard svg{width:24px;height:24px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:16px;border-radius:var(--r);background:#fff6dc;border:3px dashed #e0b14a;min-height:130px;margin-top:16px}
.tray-empty{align-self:center;font-family:var(--display);font-size:22px;font-weight:700;color:#8a6200}
.gcard{touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;padding:10px 8px;border:2px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink);font-weight:700;text-align:center;font-size:16px;line-height:1.2;cursor:grab;position:relative}
.gcard svg{width:58px;height:58px;pointer-events:none}
.gcard span{pointer-events:none}
.gcard.sel{box-shadow:0 0 0 5px var(--kunyit),0 4px 0 var(--ink)}
.gcard.dragging{z-index:40;cursor:grabbing;box-shadow:0 14px 24px rgba(28,33,71,.3);transition:none}
.gcard.shake{animation:shake .4s}
@media (max-width:560px){.zones{gap:10px}.zone{padding:10px 6px;min-height:190px}.zone h3{font-size:21px}.gcard{width:128px;font-size:15px}}

/* reward */
.reward{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.reward{grid-template-columns:1fr}}
.badge-wrap{display:grid;place-items:center}
.badge-wrap svg{width:min(340px,80vw);height:auto}
.stamp{animation:stamp .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{transform:scale(2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
.stars-row{display:flex;gap:10px;margin:14px 0}
.stars-row svg{width:62px;height:62px}
.star-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.star-list li{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:17px}
.star-list svg{width:26px;height:26px;flex:none}

/* guide */
.guide{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:3px solid var(--ink);box-shadow:0 -6px 18px rgba(28,33,71,.12)}
.guide-inner{max-width:1180px;margin:0 auto;padding:6px 20px 8px;display:flex;align-items:center;gap:12px}
.guide-inner>svg{width:84px;height:auto;flex:none}
.bubble{flex:1;background:#fff7de;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 10px 8px 14px;font-size:17px;display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:52px}
.bubble .spk{width:36px;height:36px}
.bubble .spk svg{width:18px;height:18px}
.bubble.new{animation:pop .3s}
@media (max-width:560px){.guide-inner>svg{width:58px}.guide-inner{padding:6px 10px;gap:8px}.bubble{font-size:15px}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,24,60,.55);display:grid;place-items:center;z-index:60;padding:16px}
.sheet{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:24px 26px;border:3px solid var(--ink)}
.sheet h2{font-size:30px;font-weight:800}
.sheet h3{font-size:20px;font-weight:800;margin:18px 0 6px}
.sheet ul,.sheet ol{margin:0;padding-left:22px}
.sheet li{margin:3px 0}
.sheet .close-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:16px;margin-top:10px}
.kv dt{font-weight:700;color:var(--muted)}
.kv dd{margin:0}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:70;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;animation:pop .25s}

/* quest */
.qpath{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:6px 12px;margin-bottom:18px}
.qpath svg{width:100%;max-height:150px;display:block}
.quest{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.quest{grid-template-columns:1fr}}
.device{background:var(--ink);border-radius:26px;padding:14px;box-shadow:6px 6px 0 rgba(28,33,71,.25)}
.device-bar{display:flex;align-items:center;gap:7px;color:#c8cff6;font-size:14px;font-weight:700;padding:0 6px 10px}
.device-bar i{width:10px;height:10px;border-radius:50%;background:#d9434f;display:inline-block}
.device-bar i+i{background:#f6b21b}.device-bar i+i+i{background:#23935f}
.device-bar span{margin-left:6px}
.screen{background:#eaf3ff;border-radius:16px;padding:18px;min-height:250px;display:flex;align-items:center}
.msg{background:#fff;border-radius:16px;border:2px solid var(--ink);padding:14px 16px;animation:pop .35s;width:100%}
.msg.glow{box-shadow:0 0 0 4px #ffe08a,0 0 26px 8px rgba(246,178,27,.55)}
.from{display:flex;gap:10px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:#d4d8ee;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;flex:none;border:2px solid var(--ink)}
.from b{display:block;font-size:17px;overflow-wrap:anywhere;line-height:1.2}
.from small{color:var(--muted);font-size:14px}
.msg-text{font-size:21px;margin:12px 0 8px;line-height:1.4;font-weight:700}
.fake-link{display:inline-block;color:#1a56d6;text-decoration:underline;font-size:17px;overflow-wrap:anywhere}
.choices{display:grid;gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;padding:12px 16px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15}
.choice svg{width:48px;height:48px;flex:none}
.choice small{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted)}
.choice:hover:not(:disabled){background:#fff7de}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice:disabled{opacity:.4;cursor:not-allowed;transform:none}
.result{border-radius:var(--r);padding:16px 18px;border:3px solid var(--ink);animation:pop .3s}
.result.best{background:#e3f5ec}.result.safe{background:#eef0fb}.result.oops{background:#fdeced}
.result h3{font-size:28px;font-weight:800}
.result p{margin-top:6px;font-size:18px}
.clues{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.clues li{display:flex;gap:8px;align-items:center;font-size:17px;background:#fff;border-radius:10px;padding:6px 10px}
.clues svg{width:24px;height:24px;flex:none}
.pts{display:inline-flex;gap:4px;align-items:center;margin-top:10px;font-weight:700;font-variant-numeric:tabular-nums}
.pts svg{width:28px;height:28px}
.glowpulse{animation:glowp 1.4s ease-in-out infinite}
@keyframes glowp{50%{opacity:.08}}

/* jump game */
.river svg{display:block;width:100%;height:auto}
.croc{opacity:0;pointer-events:none;transition:opacity .4s}
.croc.show{opacity:1;pointer-events:auto;cursor:pointer}
.croc .bd{transition:transform .7s ease-in,opacity .7s}
.croc.sink .bd{transform:translateY(30px);opacity:0}
.croc .sign{transition:opacity .3s}
.croc.landed .sign{opacity:0}
#kt{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.jq{margin-top:18px}
.jopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:640px){.jopts{grid-template-columns:1fr}}
.jopt{flex-wrap:wrap}
.pw{font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:22px;overflow-wrap:anywhere}
.meter{display:flex;gap:4px;align-items:center;font-size:14px;font-weight:700;width:100%;padding-left:46px}
.meter i{width:24px;height:9px;border-radius:3px;background:#e1e3ef}
.meter.ok i.on{background:var(--daun)}.meter.weak i.on{background:var(--sirih)}
.meter span{margin-left:6px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
/* ===================== state ===================== */
const STORE = 'dsa-progress-v1';
const state = { progress:{}, help:false, sound:true };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE)) || {}); } catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} }

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const idh = (t, tag='p') => `<${tag} class="idh">${t}</${tag}>`;
const strip = s => s.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===================== sound ===================== */
const Speech = {
  voice:null,
  init(){
    if(!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v=>/^en[-_](US|GB)/i.test(v.lang) && /samantha|google us|zira|aria|jenny|libby|female/i.test(v.name))
        || vs.find(v=>/^en[-_](US|GB)/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  say(text, rate=0.85){
    if(!state.sound || !('speechSynthesis' in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(strip(text));
      u.lang = 'en-US'; if(this.voice) u.voice = this.voice; u.rate = rate; u.pitch = 1.05;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
Speech.init();
let actx;
function tone(seq){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    seq.forEach(([f,d])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.03); t += d*0.75;
    });
  }catch(e){}
}
/* pentatonic chimes, a nod to gamelan */
const sfx = {
  good:()=>tone([[523,.12],[587,.12],[784,.22]]),
  bad:()=>tone([[247,.16],[220,.26]]),
  star:()=>tone([[659,.1],[784,.1],[880,.1],[1047,.32]]),
  tap:()=>tone([[660,.05]])
};

  return `<svg ${cls?`class="${cls}"`:''} viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><g stroke="${INK}" stroke-width="2.6" stroke-linejoin="round" fill="none">${ICONS[name]}</g></svg>`;
}

/* ===================== art: characters ===================== */
const OUTLINE = '#2a1a10';
function person(o){
  const {x=0,y=0,s=1,skin='#c98b5e',hair='#2b1a12',top='#f4c7d0',panel='#fff4f6',bottom='url(#parang)',type='girl',style='bun',arms='down',mouth='smile',sash=null,screen='play',flip=false,hijab='#2a7d8c',belt=true,pants='#2a3256',sarong=true} = o;
  const st = `stroke="${OUTLINE}" stroke-width="2" stroke-linejoin="round"`;
  let back='';
  if(style==='flower') back = `<path d="M32 40 Q32 12 60 12 Q88 12 88 40 L91 94 L29 94 Z" fill="${hair}"/>`;
  if(style==='sanggul') back = `<circle cx="81" cy="45" r="12" fill="${hair}" ${st}/><g fill="#fff"><circle cx="76" cy="36" r="2.4"/><circle cx="82" cy="34" r="2.4"/><circle cx="88" cy="38" r="2.4"/><circle cx="91" cy="45" r="2.4"/></g>`;

/* ---------- quest game ---------- */
function questGame(stage, M, meta, run, api){
  const G = M.game; let idx = 0, points = 0, safeFirst = 0, tried = false;
  const CH = [['click','cursor','Click Link','Open the link'],['del','trash','Ignore & Delete','Do not open it. Delete it.'],['ask','adult','Ask Adult','Show a parent or teacher.']];
  stage.innerHTML = `<div class="step-intro"><h2>${G.title}</h2><p>Read each message carefully. Then choose what Ahmad should do. Safe choices move Ahmad closer to Istana Siak.</p>${idh('Baca setiap pesan dengan teliti, lalu pilih tindakan Ahmad. Pilihan yang aman membawa Ahmad lebih dekat ke Istana Siak.')}</div>
    <div class="qpath" id="qpath"></div>
    <div class="quest"><div id="qdev"></div><div id="qside"></div></div>
    ${api.nextBar('Next: Check')}`;
  api.bindNext();
  say('Look closely at each message. Then choose: click, delete, or ask an adult?','Perhatikan setiap pesan. Lalu pilih: klik, hapus, atau tanya orang dewasa?');
  function path(){
    const xs = [70,190,310,430]; const n = G.scenes.length;
    const ax = idx < n ? xs[idx] : 520;
    return `<svg viewBox="0 0 680 140" role="img" aria-label="Quest path: level ${Math.min(idx+1,n)} of ${n}">
      <path d="M30 112 H590" stroke="#b6bad6" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 15"/>
      ${xs.map((x,i)=>`<g transform="translate(${x} 112)"><circle r="18" fill="${i<idx?'#f6b21b':'#fff'}" stroke="${INK}" stroke-width="3"/><text y="6" text-anchor="middle" font-size="17" font-weight="800" fill="${INK}">${i+1}</text></g>`).join('')}
      ${palace(560,8,1)}<text x="610" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="${INK}">Istana Siak</text>
      ${person({...CAST.ahmad, x:ax-18, y:20, s:.3, mouth: idx<n?'smile':'grin'})}
    </svg>`;
  }
  function scene(){
    const s = G.scenes[idx]; tried = false;
    $('#qpath').innerHTML = path();
    $('#qdev').innerHTML = `<div class="device"><div class="device-bar"><i></i><i></i><i></i><span>${s.device}</span></div>
      <div class="screen"><div class="msg glow"><div class="from"><span class="avatar">${s.avatar}</span><div><b>${s.sender}</b><small>${s.note}</small></div></div>
      <p class="msg-text">${s.text}</p><span class="fake-link">${s.link}</span></div></div></div>
      <button class="btn sec sm" id="qlisten" style="margin-top:14px">${SPK} Listen to the message</button>`;
    $('#qlisten').onclick = () => Speech.say(`A message from ${s.sender.replace(/[_@.]/g,' ')}. ${s.text}`);
    choices();
  }
  function choices(){
    const s = G.scenes[idx];
    $('#qside').innerHTML = `<p class="panel-count">${s.level} of ${G.scenes.length} · What should Ahmad do?</p>${idh('Apa yang harus Ahmad lakukan?')}
      <div class="choices" style="margin-top:10px">${CH.map(([k,ic,l,sub])=>`<button class="choice" data-k="${k}" ${k==='click'&&tried?'disabled':''}>${icon(ic,48)}<span>${l}<small>${sub}</small></span></button>`).join('')}</div>`;
    $$('.choice', stage).forEach(b=>b.onclick=()=>choose(b.dataset.k));
  }
  function choose(k){
    const s = G.scenes[idx]; const [title,msg,mid] = G.out[k];
    if(k==='click'){
      tried = true; sfx.bad();
      $('#qside').innerHTML = `<div class="result oops" role="status"><h3>${title}</h3><p>${msg}</p>${idh(mid)}<div class="b-actions"><button class="btn" id="qretry">Choose again</button></div></div>`;
      say(msg, mid); Speech.say(title+' '+msg);
      $('#qretry').onclick = choices; return;
    }
    const got = k==='ask' ? 2 : 1; points += got; if(!tried) safeFirst++;
    sfx.good();
    const last = idx === G.scenes.length-1;
    $('.msg', stage).classList.remove('glow');
    $('#qside').innerHTML = `<div class="result ${k==='ask'?'best':'safe'}" role="status"><h3>${title}</h3><p>${msg}</p>${idh(mid)}
      <div class="pts">${Array.from({length:got},()=>STAR()).join('')} +${got} ${got===1?'point':'points'}</div>
      <h4 style="margin-top:14px;font-size:20px">Clues you can spot</h4>${idh('Petunjuk yang bisa kamu temukan')}
      <ul class="clues">${s.clues.map((c,i)=>`<li>${icon('magnifier',24)}<span>${c}${idh(s.cluesId[i],'span')}</span></li>`).join('')}</ul>
      <div class="b-actions"><button class="btn" id="qnext">${last?'Reach Istana Siak →':'Next message →'}</button></div></div>`;
    say(`${title} ${msg}`, mid); Speech.say(`${title} ${msg}`);
    $('#qnext').onclick = () => { idx++; if(idx < G.scenes.length) scene(); else finish(); };
  }
  function finish(){
    const n = G.scenes.length;
    run.game = safeFirst/n; run.gameGot = safeFirst; run.gameTotal = n; api.complete('game');
    $('#qpath').innerHTML = path();
    $('#qdev').innerHTML = `<div class="panel">${sceneSVG('m8win','Ahmad arrives safely at Istana Siak')}</div>`;
    $('#qside').innerHTML = `<div class="result best" role="status"><h3>Quest complete!</h3><p>Ahmad reached Istana Siak safely. You earned ${points} of ${n*2} points. ${safeFirst} of ${n} messages were handled safely on the first try.</p>${idh('Ahmad tiba di Istana Siak dengan selamat.')}</div>`;
    sfx.star(); say('Hooray! Ahmad is safe. Remember: think before you click!','Hore! Ahmad aman. Ingat: pikir dulu sebelum mengklik!');
  }
  scene();
}

const BOOKC = ['#d9434f','#2a3990','#23935f','#f6b21b','#7a4a25','#5d1f5f','#1a56d6','#e8833a'];
function shelf(x,y,w,h){
  let books='';
  [0,1,2,3].forEach(r=>{
    let bx = x+10; const by = y+12+r*(h-20)/4; const bh = (h-20)/4-10; let k = r*3;
    while(bx < x+w-28){ const bw = 12 + ((k*7)%9); const tall = bh - ((k*5)%8);
      books += `<rect x="${bx}" y="${by+bh-tall}" width="${bw}" height="${tall}" fill="${BOOKC[k%BOOKC.length]}" stroke="${OUTLINE}" stroke-width="1.5"/>`; bx += bw+2; k++; }
    books += `<rect x="${x+6}" y="${by+bh}" width="${w-12}" height="7" fill="#6b3f1f"/>`;
  });
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#8a5428" stroke="${OUTLINE}" stroke-width="3"/><rect x="${x+6}" y="${y+6}" width="${w-12}" height="${h-12}" fill="#5a3216"/>${books}`;
}

function croc(i,L,x,y){
  return `<g class="croc" id="c${i}${L}" data-i="${i}" data-l="${L}" transform="translate(${x} ${y}) scale(.72)" role="button" aria-label="Crocodile ${L}"><g class="bd">

    <g stroke="${OUTLINE}" stroke-width="2" stroke-linejoin="round">

      <ellipse rx="40" ry="14" fill="#4f8a3c"/>
      <path d="M28 -9 Q58 -8 64 0 Q58 8 28 9Z" fill="#5c9c46"/>
      ${[-24,-12,0,12].map(k=>`<path d="M${k} -12 l5 -7 l5 7Z" fill="#3e7230"/>`).join('')}
      <circle cx="32" cy="-11" r="5.5" fill="#5c9c46"/>

      <text y="-6" text-anchor="middle" font-size="24" font-weight="800" fill="${INK}">${L}</text></g>
  </g></g>`;
}
function jumpGame(stage, M, meta, run, api){
  const G = M.game, R = G.rounds, n = R.length;
  const X = i => 175 + i*95, Y = {A:112, B:262};
  let idx = 0, firstTry = 0, tried = false, busy = false;
  const cuc = (x,y,r) => `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse rx="15" ry="6" fill="#3f9a5d" stroke="${OUTLINE}" stroke-width="2"/><path d="M-8 -1 H8" stroke="#a8dbb5" stroke-width="2"/></g>`;
  stage.innerHTML = `<div class="step-intro"><h2>${G.title}</h2><p>${G.intro[0]}</p>${idh(G.intro[1])}</div>
    <div class="game-score"><div class="bar"><span id="gbar"></span></div><span id="gcount">Crossing 1 of ${n}</span></div>
    <div class="panel river"><svg viewBox="0 0 800 360" role="img" aria-label="Kancil crossing a river on crocodiles">
      <rect width="800" height="360" fill="#4f8fd1"/><rect width="800" height="360" fill="url(#waves)"/>
      <path d="M0 0 H112 Q92 180 118 360 H0Z" fill="#7cc58f" stroke="${OUTLINE}" stroke-width="3"/>
      <path d="M690 0 Q712 180 686 360 H800 V0Z" fill="#8fd09e" stroke="${OUTLINE}" stroke-width="3"/>
      <g stroke="${OUTLINE}" stroke-width="2"><circle cx="40" cy="60" r="26" fill="#3f9a5d"/><circle cx="62" cy="300" r="22" fill="#3f9a5d"/></g>
      <path d="M714 120 Q740 90 770 120 T790 170 M714 230 Q745 200 772 236" stroke="#2f6b45" stroke-width="4" fill="none"/>
      ${cuc(728,112,-20)}${cuc(768,140,25)}${cuc(740,250,10)}${cuc(776,226,-30)}${cuc(724,300,15)}
      <g transform="translate(730 30)"><path d="M20 30 V54" stroke="#6b3f1f" stroke-width="4"/><rect width="56" height="30" rx="6" fill="#fff7de" stroke="${INK}" stroke-width="2.5"/><text x="28" y="21" text-anchor="middle" font-size="15" font-weight="800" fill="${INK}">Timun</text></g>
      ${R.map((r,i)=>croc(i,'A',X(i),Y.A)+croc(i,'B',X(i),Y.B)).join('')}
      <g id="kt">${kancil(0,0,.5)}</g>
    </svg></div>
    <div class="jq" id="jq"></div>
    ${api.nextBar('Next: Check')}`;
  api.bindNext();
  say('Help Kancil cross the river. Choose the crocodile with the strong and safe answer!','Bantu Kancil menyeberangi sungai. Pilih buaya dengan jawaban yang kuat dan aman!');
  const kt = $('#kt', stage);
  const place = (x,y) => { kt.style.transform = `translate(${x}px, ${y}px)`; };
  place(30, 150);
  $$('.croc', stage).forEach(c=>c.addEventListener('click', ()=>{ if(+c.dataset.i===idx && !busy) choose(c.dataset.l); }));
  const meter = strong => `<span class="meter ${strong?'ok':'weak'}">${[0,1,2,3].map(i=>`<i class="${i<(strong?4:1)?'on':''}"></i>`).join('')}<span>${strong?'Strong':'Weak'}</span></span>`;
  function round(){
    const r = R[idx]; tried = false; busy = false;
    ['A','B'].forEach(L=>$(`#c${idx}${L}`, stage).classList.add('show'));
    $('#gcount').textContent = `Crossing ${idx+1} of ${n}`;
    $('#jq').innerHTML = `<div class="q"><h4><span><span class="qnum">Crossing ${idx+1}</span><br>${r.q}</span><button class="spk" aria-label="Listen">${SPK}</button></h4>
      <div class="jopts">${['A','B'].map(L=>`<button class="opt jopt" data-l="${L}"><span class="k">${L}</span><span class="${r.kind==='pw'?'pw':''}">${r[L]}</span></button>`).join('')}</div>
      <div class="fb" hidden aria-live="polite"></div></div>`;
    $('#jq .spk').onclick = () => Speech.say(`${r.q} A: ${r.kind==='pw'?r.A.split('').join(' '):r.A} B: ${r.kind==='pw'?r.B.split('').join(' '):r.B}`);
    $$('#jq .jopt').forEach(b=>b.onclick=()=>choose(b.dataset.l));
  }
  function choose(L){
    if(busy) return;
    const r = R[idx]; const btn = $(`#jq .jopt[data-l="${L}"]`); const fb = $('#jq .fb'); fb.hidden = false;
    if(btn.disabled) return;
    if(L===r.ans){
      busy = true; if(!tried) firstTry++; sfx.good();
      btn.classList.add('right'); $$('#jq .jopt').forEach(b=>b.disabled=true);
      const other = L==='A'?'B':'A';
      $(`#c${idx}${other}`, stage).classList.add('sink');
      const c = $(`#c${idx}${L}`, stage); c.classList.add('landed');
      place(X(idx)-28, Y[L]-52);
      if(r.kind==='pw') $$('#jq .jopt').forEach(b=>b.insertAdjacentHTML('beforeend', meter(b.dataset.l===r.ans)));
      $('#gbar').style.width = ((idx+1)/n*100)+'%';
      const last = idx===n-1;
      fb.className = 'fb good'; fb.innerHTML = `${r.why}${idh(r.id,'span')}<div class="b-actions"><button class="btn" id="jnext">${last?'Jump to the cucumber garden →':'Next crossing →'}</button></div>`;
      say(`Safe jump! ${r.why}`, r.id); Speech.say(`Safe jump! ${r.why}`);
      $('#jnext').onclick = () => { idx++; if(idx<n) round(); else finish(); };
    } else {
      tried = true; sfx.bad(); btn.classList.add('wrong'); btn.disabled = true;
      $(`#c${idx}${L}`, stage).classList.add('sink');
      if(r.kind==='pw') btn.insertAdjacentHTML('beforeend', meter(false));
      fb.className = 'fb try'; fb.innerHTML = `Splash! That crocodile swam away. ${r.why}${idh(r.id,'span')}`;
      say('Splash! That answer is not safe. Look again and choose the other crocodile.','Byur! Jawaban itu tidak aman. Lihat lagi dan pilih buaya yang lain.'); Speech.say('Splash! That answer is not safe. Try the other one.');
    }
  }
  function finish(){
    place(712, 150);
    run.game = firstTry/n; run.gameGot = firstTry; run.gameTotal = n; api.complete('game');
    $('#gcount').textContent = `All ${n} crossings done`;
    $('#jq').innerHTML = `<div class="result best" role="status"><h3>Kancil made it!</h3><p>Kancil crossed the river and reached the cucumber garden. ${firstTry} of ${n} crossings were right on the first try.</p>${idh('Kancil berhasil menyeberang dan sampai di kebun timun.')}</div>`;
    sfx.star(); say('Hooray! Strong passwords keep us safe, just like strong crocodiles kept Kancil dry!','Hore! Kata sandi yang kuat menjaga kita tetap aman!');
  }
  round();
}

function toast(msg){
  $$('.toast').forEach(t=>t.remove());
  const t = h(`<div class="toast" role="status">${msg}</div>`); document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function overlay(inner, onClose){
  const o = h(`<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">${inner}</div></div>`);
  const close = () => { o.remove(); document.removeEventListener('keydown', esc); onClose&&onClose(); };
  const esc = e => { if(e.key==='Escape') close(); };
  o.addEventListener('click', e=>{ if(e.target===o || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', esc);
  document.body.appendChild(o);
  const f = o.querySelector('button'); f&&f.focus();
  return {el:o, close};
}

function status(m){
  const p = state.progress[m.id];
  if(p && p.done) return 'done';
  if(!m.ready) return 'soon';
  if(state.teacher) return 'open';
  const prev = MODULES.find(x=>x.id===m.id-1);
  if(!prev || (state.progress[prev.id]&&state.progress[prev.id].done)) return 'open';
  return 'locked';
}
const STATUS_LABEL = {done:'Completed', open:'Ready to play', locked:'Finish the module before', soon:'Coming in the next update'};
function goModule(id){
  const m = MODULES.find(x=>x.id===id); const st = status(m);
  if(st==='open' || st==='done'){ location.hash = 'module-'+id; }
  else if(st==='soon') toast(`Module ${id} is coming in the next update.`);
  else toast(`Finish Module ${id-1} first to unlock Module ${id}.`);
}

/* ===================== reusable activities ===================== */
const LETTERS = 'ABCD';
function mcq(container, {q, qid, opts, a, fb, num, row=false, onDone}){
  const el = h(`<div class="q"><h4><span>${num?`<span class="qnum">${num}</span><br>`:''}${q}</span><button class="spk" aria-label="Listen to the question">${SPK}</button></h4>${qid?idh(qid):''}
    <div class="opts ${row?'row':''}">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fb" hidden aria-live="polite"></div></div>`);
  let first = true, solved = false;
  $('.spk', el).onclick = () => Speech.say(strip(q).replace(/_+/g,'blank') + '. ' + opts.map((o,i)=>LETTERS[i]+'. '+o).join('. '));
  $$('.opt', el).forEach(b=>b.onclick=()=>{
    if(solved) return;
    const i = +b.dataset.i; const f = $('.fb', el); f.hidden = false;
    if(i===a){
      solved = true; b.classList.add('right'); sfx.good();
      f.className='fb good'; f.innerHTML = fb || 'Correct!';
      Speech.say(fb || 'Correct!');
      $$('.opt', el).forEach(x=>x.disabled=true);
      onDone && onDone(first);
    } else {
      first = false; b.classList.add('wrong'); b.disabled = true; sfx.bad();
      f.className='fb try'; f.innerHTML = 'Not yet. Read the question again and try another answer.' + idh('Belum tepat. Baca lagi pertanyaannya dan coba jawaban lain.','span');
    }
  });
  container.appendChild(el); return el;
}
function blankQ(container, {before, after, qid, opts, a, fb, num, onDone}){
  const el = h(`<div class="q"><h4><span>${num?`<span class="qnum">${num}</span><br>`:''}${before} <span class="blank">?</span>${after}</span><button class="spk" aria-label="Listen">${SPK}</button></h4>${qid?idh(qid):''}
    <div class="opts row">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}</div><div class="fb" hidden aria-live="polite"></div></div>`);
  let first = true, solved = false;
  $('.spk', el).onclick = () => Speech.say(`${before} blank ${after}. ${opts.join(' or ')}?`);
  $$('.opt', el).forEach(b=>b.onclick=()=>{
    if(solved) return;
    const i = +b.dataset.i; const f = $('.fb', el); f.hidden = false;
    if(i===a){
      solved = true; b.classList.add('right'); sfx.good();
      const bl = $('.blank', el); bl.textContent = opts[a]; bl.classList.add('filled');
      f.className='fb good'; f.innerHTML = fb; Speech.say(fb);
      $$('.opt', el).forEach(x=>x.disabled=true); onDone && onDone(first);
    } else {
      first = false; b.classList.add('wrong'); b.disabled = true; sfx.bad();
      f.className='fb try'; f.innerHTML = 'Not yet. Try the other word.' + idh('Belum tepat. Coba kata yang lain.','span');
    }
  });
  container.appendChild(el); return el;
}
function sentenceBuilder(container, sentences, onDone){
  let idx = 0;
  const el = h(`<div class="builder"><div class="b-head"><strong style="font-family:var(--display);font-size:20px">Tap the words in order</strong><span class="count"></span></div>${idh('Ketuk kata-kata secara berurutan untuk menyusun kalimat. Ketuk kata di kotak atas untuk mengembalikannya.')}
    <div class="slot-row" aria-label="Your sentence"></div><div class="tile-row"></div>
    <div class="b-actions"><button class="btn sec sm" data-act="reset">Start again</button><button class="btn sec sm" data-act="listen">${SPK} Listen</button></div><div class="fb" hidden aria-live="polite"></div></div>`);
  const slot = $('.slot-row', el), tiles = $('.tile-row', el), fbx = $('.fb', el);
  let words = [];
  function load(){
    const s = sentences[idx]; words = s.split(' ');
    let order = shuffle(words.map((w,i)=>i)); if(order.every((v,i)=>v===i)) order = order.reverse();
    slot.innerHTML=''; slot.className='slot-row'; fbx.hidden = true;
    tiles.innerHTML = order.map(i=>`<button class="tile" data-w="${words[i]}">${words[i]}</button>`).join('');
    $('.count', el).textContent = `Sentence ${idx+1} of ${sentences.length}`;
    $$('.tile', tiles).forEach(t=>t.onclick=()=>move(t));
  }
  function move(t){
    if(slot.classList.contains('ok')) return;
    sfx.tap(); slot.classList.remove('bad');
    (t.parentElement===tiles ? slot : tiles).appendChild(t);
    if(slot.children.length===words.length) check();
    else fbx.hidden = true;
  }
  function check(){
    const built = [...slot.children].map(t=>t.dataset.w).join(' ');
    if(built===sentences[idx]){
      slot.classList.add('ok'); sfx.good(); Speech.say(built);
      fbx.hidden=false; fbx.className='fb good'; fbx.textContent = idx < sentences.length-1 ? 'Great sentence! Here comes the next one.' : 'Great sentence! You built all three.';
      setTimeout(()=>{ idx++; if(idx<sentences.length) load(); else { tiles.innerHTML=''; $('.count', el).textContent='All done'; onDone&&onDone(); } }, 1600);
    } else {
      void slot.offsetWidth; slot.classList.add('bad'); sfx.bad();
      fbx.hidden=false; fbx.className='fb try'; fbx.innerHTML = 'Almost! Tap a word in the box to move it back, then try again.' + idh('Hampir! Ketuk kata di kotak untuk mengembalikannya, lalu coba lagi.','span');
    }
  }
  el.querySelector('[data-act="reset"]').onclick = load;
  el.querySelector('[data-act="listen"]').onclick = () => Speech.say(sentences[Math.min(idx, sentences.length-1)]);
  container.appendChild(el); load(); return el;
}

function stepGame(stage, M, meta, run, api){ return ({quest:questGame, jump:jumpGame, sort:sortGame}[M.gameType])(stage, M, meta, run, api); }
function sortGame(stage, M, meta, run, api){
  const G = M.game; const cards = shuffle(G.cards.map(c=>({...c, wrong:false})));
  let sorted = 0, firstTry = 0, sel = null, drag = null, justDragged = false;
  stage.innerHTML = `
    <div class="step-intro"><h2>${G.title}</h2><p>Drag each card into the <b>Private Vault</b> or <b>Safe Share</b>. You can also tap a card, then tap a box.</p>${idh('Seret setiap kartu ke Private Vault (brankas rahasia) atau Safe Share (boleh dibagikan). Bisa juga ketuk kartu, lalu ketuk kotaknya.')}</div>
    <div class="game-score"><div class="bar"><span id="gbar"></span></div><span id="gcount">0 / ${cards.length} sorted</span></div>
    <div class="zones">
      <div class="zone vault" data-zone="vault" tabindex="0" role="button" aria-label="Private Vault">${icon('vault',78,'zi')}<h3>Private Vault</h3><span class="zs">Keep it secret</span>${idh('Simpan rahasia','span')}<div class="stack"></div></div>
      <div class="zone share" data-zone="share" tabindex="0" role="button" aria-label="Safe Share">${icon('share',78,'zi')}<h3>Safe Share</h3><span class="zs">OK to share</span>${idh('Boleh dibagikan','span')}<div class="stack"></div></div>
    </div>
    <div class="tray" id="tray">${cards.map((c,i)=>`<button class="gcard" data-i="${i}">${icon(c.icon,58)}<span>${c.t}</span></button>`).join('')}</div>
    ${api.nextBar('Next: Check')}`;
  api.bindNext();
  say('Help Sri sort the cards. Is it private, or is it safe to share?','Bantu Sri memilah kartu. Rahasia, atau boleh dibagikan?');
  const tray = $('#tray'), zones = $$('.zone', stage);
  const select = c => { $$('.gcard', tray).forEach(x=>x.classList.toggle('sel', x===c)); sel = c; };
  const zoneAt = (x,y) => zones.find(z=>{ const r=z.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; });
  const hot = z => zones.forEach(q=>q.classList.toggle('hot', q===z));
  function drop(cardEl, zone){
    const c = cards[+cardEl.dataset.i];
    hot(null);
    if(c.zone===zone.dataset.zone){
      sfx.good(); cardEl.remove(); sel = null; sorted++; if(!c.wrong) firstTry++;
      $('.stack', zone).insertAdjacentHTML('beforeend', `<span class="chipcard">${icon(c.icon,24)}${c.t}</span>`);
      zone.classList.remove('flash'); void zone.offsetWidth; zone.classList.add('flash');
      $('#gbar').style.width = (sorted/cards.length*100)+'%';
      $('#gcount').textContent = `${sorted} / ${cards.length} sorted`;
      say(c.why, c.id); Speech.say(c.why);
      if(sorted===cards.length){
        run.game = firstTry/cards.length; run.gameGot = firstTry; run.gameTotal = cards.length; api.complete('game');
        tray.innerHTML = `<span class="tray-empty">All cards sorted! First-try score: ${firstTry} / ${cards.length}</span>`;
        setTimeout(()=>{ if(!document.body.contains(tray)) return; say(`Amazing! You sorted all the cards. ${firstTry} were right on the first try.`, `Luar biasa! Semua kartu sudah dipilah. ${firstTry} benar pada percobaan pertama.`); sfx.star(); }, 900);
      }
    } else {
      c.wrong = true; sfx.bad();
      cardEl.classList.remove('shake'); void cardEl.offsetWidth; cardEl.classList.add('shake');
      const hnt = G.hint[c.zone]; say(hnt[0], hnt[1]); Speech.say(hnt[0]);
    }
  }
  tray.addEventListener('pointerdown', e=>{
    const c = e.target.closest('.gcard'); if(!c || e.button>0) return;
    drag = {c, x:e.clientX, y:e.clientY, moved:false};
    try{ c.setPointerCapture(e.pointerId); }catch(err){}
  });
  tray.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(!drag.moved && Math.hypot(dx,dy)>8){ drag.moved = true; drag.c.classList.add('dragging'); select(drag.c); }
    if(drag.moved){ drag.c.style.transform = `translate(${dx}px,${dy}px) rotate(-3deg)`; hot(zoneAt(e.clientX,e.clientY)); e.preventDefault(); }
  });
  const end = e => {
    if(!drag) return; const d = drag; drag = null;
    if(d.moved){
      justDragged = true; setTimeout(()=>justDragged=false, 60);
      d.c.classList.remove('dragging'); d.c.style.transform = '';
      const z = e.type==='pointerup' ? zoneAt(e.clientX,e.clientY) : null;
      if(z) drop(d.c, z); else hot(null);
    }
  };
  tray.addEventListener('pointerup', end);
  tray.addEventListener('pointercancel', end);
  tray.addEventListener('click', e=>{
    const c = e.target.closest('.gcard'); if(!c || justDragged) return;
    if(sel===c){ select(null); return; }
    select(c); sfx.tap(); Speech.say(cards[+c.dataset.i].t);
  });
  zones.forEach(z=>{
    const act = () => { if(sel) drop(sel, z); else say('First tap a card, then tap this box.','Ketuk kartu dulu, lalu ketuk kotak ini.'); };
    z.addEventListener('click', act);
    z.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  });
}

  $('#again').onclick = () => renderModule(meta.id);
  sfx.star();
  say(`Congratulations! You earned ${stars} ${stars===1?'star':'stars'} and the ${meta.badge} badge.`, `Selamat! Kamu mendapat ${stars} bintang dan lencana ${meta.badge}.`);
  setTimeout(()=>Speech.say(`Congratulations! You are a ${meta.badge}!`), 500);
}

/* ---------- teacher notes ---------- */
function teacherNotes(id){
  const M = CONTENT[id], meta = MODULES.find(m=>m.id===id);
  const akey = M.assess.map(q => q.type==='mc'
    ? `<li>${q.q} <b>${LETTERS[q.a]}. ${q.opts[q.a]}</b></li>`
    : `<li>“${q.before?q.before+' ':''}____${q.after}” (${q.opts.join(' / ')}) <b>${q.opts[q.a]}</b></li>`).join('');
  overlay(`
    <div class="close-row"><h2>Teacher notes · Module ${id}</h2><button class="btn sec sm" data-close>Close</button></div>
    <p style="color:var(--muted)">${meta.theme}: ${meta.title}</p>
    <dl class="kv">
      <dt>Time allocation</dt><dd>15 minutes: Story 4 · Vocabulary 3 · Game 5 · Assessment 3</dd>
      <dt>Target value</dt><dd>${M.value}</dd>
      <dt>Language focus</dt><dd>${M.focus}</dd>
      <dt>Setting</dt><dd>${M.setting}</dd>
    </dl>
    <h3>Learning objectives</h3><ul>${M.objectives.map(o=>`<li>${o}</li>`).join('')}</ul>
    <h3>Answer key: story questions</h3><ol>${M.comprehension.map(c=>`<li>${c.q} <b>${c.opts[c.a]}</b></li>`).join('')}</ol>
    <h3>Answer key: ${M.drill.title}</h3><ol>${M.drill.items.map(d=>`<li>${d.q.replace('____','<b>'+M.drill.opts[d.a]+'</b>')}</li>`).join('')}</ol>
    <h3>Answer key: ${M.game.title}</h3>${M.gameKey()}
    <h3>Answer key: assessment</h3><ol>${akey}</ol>
    <h3>Stars</h3><p>One star each for: story questions (2 of 3 right on the first try), game (${M.game.starRule}), assessment (both right on the first try). Progress is saved only in this browser.</p>
  `);
}

/* ===================== router ===================== */
function route(){
  const hs = location.hash.replace('#','');
  const m = hs.match(/^module-(\d+)$/);
  if(m){
    const id = +m[1]; const meta = MODULES.find(x=>x.id===id);
    if(meta && CONTENT[id] && (status(meta)==='open' || status(meta)==='done')){ renderModule(id); return; }
  }
  renderHome(); window.scrollTo({top:0});
}
addEventListener('hashchange', route);
drawTop(); route();
</script>
</body>
